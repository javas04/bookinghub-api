# Render Blueprint for the public demo: https://render.com/docs/blueprint-spec
# Free plan: the service sleeps after ~15 min idle and its SQLite file is reset on every
# restart or deploy. Startup migrations and seeding rebuild the demo data each time.
services:
  - type: web
    name: bookinghub-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: "8080"
      # Render terminates TLS in its proxy: trust X-Forwarded-* so the app sees the
      # real scheme (https in the OpenAPI document) and client IP (rate limiting).
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      # Secrets generated by Render, never stored in the repository.
      - key: Jwt__SigningKey
        generateValue: true
      - key: Database__Seed__AdminEmail
        value: admin@bookinghub.local
      - key: Database__Seed__AdminPassword
        generateValue: true
      - key: Database__Seed__SampleSpaces
        value: "true"
